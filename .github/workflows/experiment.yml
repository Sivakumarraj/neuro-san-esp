name: same-budget experiment

# The paid same-budget experiment (scripts/experiment.py): a Predictor-guided search
# against a random-choice one, at the same budget, judged on held-out questions.
#
# The whole run is longer than GitHub's six-hour job limit, so it runs in legs. Each
# leg restores the previous leg's measurement cache, runs for at most 5 h 20 min,
# saves the cache as an artifact, and starts the next leg itself. The script resumes
# from the cache, so only the network being measured when a leg ends is paid for
# again. It only spends when started by hand and when the OPENAI_API_KEY secret is set.
on:
  workflow_dispatch:
    inputs:
      leg:
        description: "Leg number. The workflow sets it itself when it continues."
        required: false
        default: "1"

permissions:
  contents: read
  actions: write

concurrency:
  group: same-budget-experiment
  cancel-in-progress: false

env:
  # The models the paid head-to-heads were measured on, so the plan's price holds:
  # gpt-5.4-nano for every worker, gpt-5.4-mini as the stronger rung.
  ESP_PROVIDER: openai
  ESP_DEFAULT_MODEL: gpt-5.4-nano
  ESP_MODEL_TIERS: gpt-5.4-nano,gpt-5.4-mini
  ESP_CACHE: .esp-cache
  MAX_LEGS: "4"

jobs:
  leg:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check that the OpenAI key is set
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Add OPENAI_API_KEY under Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]" pyhocon

      - name: Restore the previous leg's measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest finished run that saved a cache. A run that stopped at the key
          # check saved nothing, so older runs are tried until one has the artifact.
          for run_id in $(gh run list --workflow experiment.yml --limit 20 \
              --json databaseId,status --jq '.[] | select(.status == "completed") | .databaseId'); do
            if gh run download "$run_id" --name experiment-state --dir state-restore 2>/dev/null; then
              tar -xzf state-restore/experiment-state.tgz
              echo "Restored the measurements saved by run $run_id"
              exit 0
            fi
          done
          echo "No earlier leg saved anything; starting fresh"

      - name: Run the experiment for up to 5 h 20 min
        id: run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          PYTHONPATH=$PWD AGENT_TOOL_PATH=$PWD timeout 320m python scripts/experiment.py --go
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 124 is the leg's own time limit: the next leg resumes. Anything else is an error.
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi

      - name: Pack the measurements
        if: always()
        run: |
          mkdir -p .esp-cache results/experiment
          tar -czf experiment-state.tgz .esp-cache results/experiment

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: experiment-state
          path: experiment-state.tgz
          retention-days: 14

      - name: Start the next leg
        if: steps.run.outputs.exit_code == '124'
        env:
          GH_TOKEN: ${{ github.token }}
          LEG: ${{ inputs.leg || '1' }}
        run: |
          if [ "$LEG" -ge "$MAX_LEGS" ]; then
            echo "::warning::Stopped after $LEG legs. Run the workflow again to continue."
            exit 0
          fi
          gh workflow run experiment.yml --ref "$GITHUB_REF_NAME" --field leg=$((LEG + 1))
