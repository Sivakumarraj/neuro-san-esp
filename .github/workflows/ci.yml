name: ci

on:
  push:
  pull_request:

# Read-only. Nothing in CI writes to the repository, and a token that cannot
# is one less thing a compromised dependency could use.
permissions:
  contents: read

# A newer push to the same branch makes the running check moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --requirement requirements.lock --no-deps --progress-spinner off

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: esp lint
      - run: esp hocon
      - run: esp test --cov --cov-report=term --cov-fail-under=85
      - run: esp offline-check
      - run: python scripts/serve_studio.py
