services:
  # The service. An event-invoked agent on an hourly cron inside neuro-san's
  # own server -- no user, no client, no request. See SERVING.md.
  optimizer:
    build: .
    restart: unless-stopped
    # The key and the model come from .env, like everywhere else. The preflight
    # inside the container demands whichever key the configured model needs, so
    # nothing here names one provider -- this used to require GOOGLE_API_KEY,
    # and refused to start on a machine holding only a Claude key.
    env_file:
      - path: .env
        required: false
    environment:
      ESP_OPTIMIZER_CRON: ${ESP_OPTIMIZER_CRON:-0 * * * *}
    volumes:
      # The population is the expensive thing here, not the compute: every
      # record in it is a paid evaluation. A container that loses it starts
      # again from the seeds.
      - esp-state:/app/state
      # A named volume, not ./results: the container runs as uid 10001, and a
      # host directory owned by somebody else is not writable from inside it.
      # `docker compose cp optimizer:/app/results ./results` copies it out.
      - esp-results:/app/results
    command: python -m neuro_san.service.main_loop.server_main_loop

  # One wake, then exit. For cron, a Kubernetes CronJob, or by hand -- anywhere
  # the scheduler lives outside the container rather than inside it.
  wake:
    build: .
    profiles: ["tools"]
    # The key and the model come from .env, like everywhere else. The preflight
    # inside the container demands whichever key the configured model needs, so
    # nothing here names one provider -- this used to require GOOGLE_API_KEY,
    # and refused to start on a machine holding only a Claude key.
    env_file:
      - path: .env
        required: false
    volumes:
      - esp-state:/app/state
    command: python apps/optimizer/run_optimizer.py

  # Phase B and C. No key, no network, no budget -- and deterministic, so this
  # either reproduces the published numbers or it does not.
  offline:
    build: .
    profiles: ["tools"]
    command: python scripts/offline_search.py --pool 2000

  # The batch loop. Real calls: a candidate costs about 165 of them.
  search:
    build: .
    profiles: ["tools"]
    # The key and the model come from .env, like everywhere else. The preflight
    # inside the container demands whichever key the configured model needs, so
    # nothing here names one provider -- this used to require GOOGLE_API_KEY,
    # and refused to start on a machine holding only a Claude key.
    env_file:
      - path: .env
        required: false
    # Bind mounts, because the point of a batch run is its files on the host.
    # The container runs as uid 10001, so give it the directories first:
    #   mkdir -p results .esp-cache && sudo chown 10001 results .esp-cache
    volumes:
      - ./results:/app/results
      - ./.esp-cache:/app/.esp-cache
    command: python scripts/run_esp.py --generations 3 --elite 3 --out results

  # Google's free tier only: which Gemini models answer, and each daily cap.
  probe:
    build: .
    profiles: ["tools"]
    # The key and the model come from .env, like everywhere else. The preflight
    # inside the container demands whichever key the configured model needs, so
    # nothing here names one provider -- this used to require GOOGLE_API_KEY,
    # and refused to start on a machine holding only a Claude key.
    env_file:
      - path: .env
        required: false
    command: python scripts/probe_models.py

volumes:
  esp-state:
  esp-results:
