# The whole runtime dependency tree, pinned. The Docker images install exactly
# this, then the project itself with --no-deps, so an image built next month
# resolves the same packages as one built today.
#
# Regenerate on purpose, in a clean Python 3.12 environment:
#   python3.12 -m venv /tmp/lock && /tmp/lock/bin/pip install -c constraints.txt .
#   /tmp/lock/bin/pip freeze --exclude-editable | grep -v '^neuro-san-esp' >> requirements.lock
# then run `make validate` before committing it.
#
# click is held at 8.3.3 by constraints.txt for PYSEC-2026-2132. The studio
# extra cannot follow: nsflow needs gTTS, and gTTS 2.5.4 requires click<8.2.
# That affects the developer UI only, never this runtime tree. See SECURITY.md.
